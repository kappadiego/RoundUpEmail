[project]
name = "personal-digestor"
version = "0.1.0"
description = "Local RSS and saved-URL digest generator with LLM topic summaries and SMTP delivery."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "Jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
nice = [
  "PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["digestor*"]

[tool.setuptools.package-data]
digestor = ["templates/*.html", "web_templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
