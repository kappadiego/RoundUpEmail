<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}RoundUpEmail{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    <style>
      :root { color-scheme: light; --ink: #15202b; --muted: #5d6b7a; --line: #dbe3ea; --surface: #ffffff; --bg: #f5f7f9; --brand: #176f62; --brand-dark: #10534a; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
      a { color: #0b65b9; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .shell { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
      .sidebar { background: #16242f; color: #ecf2f5; padding: 22px 16px; }
      .brand { font-size: 20px; font-weight: 700; margin-bottom: 24px; }
      .nav a, .nav button { display: block; width: 100%; color: #dbe7ec; background: transparent; border: 0; text-align: left; padding: 10px 8px; border-radius: 6px; font-size: 14px; cursor: pointer; }
      .nav a:hover, .nav button:hover { background: #223543; text-decoration: none; }
      .main { padding: 28px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
      h1 { font-size: 28px; margin: 0; letter-spacing: 0; }
      h2 { font-size: 20px; margin: 0 0 14px; letter-spacing: 0; }
      h3 { font-size: 15px; margin: 0 0 8px; letter-spacing: 0; }
      .muted { color: var(--muted); }
      .warning { border-left: 4px solid #c77800; background: #fff7e6; color: #6c4300; padding: 10px 12px; border-radius: 6px; font-size: 13px; line-height: 1.45; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
      .panel, .item { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
      .stack { display: grid; gap: 12px; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      button, .button { min-height: 36px; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 6px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
      button.primary, .button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
      button.primary:hover, .button.primary:hover { background: var(--brand-dark); text-decoration: none; }
      input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 6px; min-height: 38px; padding: 8px 10px; font: inherit; background: #fff; }
      label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
      form.inline { display: inline; }
      .form-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: end; }
      .notice { border-left: 4px solid var(--brand); background: #e9f6f3; padding: 10px 12px; border-radius: 6px; margin-bottom: 16px; }
      .article-title { font-size: 17px; font-weight: 700; }
      .badge { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; font-size: 12px; color: var(--muted); }
      .digest-frame { background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
      .digest-frame iframe { width: 100%; min-height: 720px; border: 0; }
      @media (max-width: 860px) { .shell { grid-template-columns: 1fr; } .sidebar { position: static; } .grid, .form-grid { grid-template-columns: 1fr; } .main { padding: 18px; } .topbar { align-items: flex-start; flex-direction: column; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">RoundUpEmail</div>
        <nav class="nav">
          <a href="/">Workspace</a>
          {% if workspace %}
            {% set slug = workspace.slug if workspace.slug is defined else workspace %}
            <a href="/w/{{ slug }}">Dashboard</a>
            <a href="/w/{{ slug }}/feeds">Feed</a>
            <a href="/w/{{ slug }}/articles">Articoli</a>
            <a href="/w/{{ slug }}/digests">Digest</a>
          {% endif %}
          <form method="post" action="/logout"><button>Esci</button></form>
        </nav>
      </aside>
      <main class="main">{% block content %}{% endblock %}</main>
    </div>
  </body>
</html>
