<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ subject }}</title>
    <style>
      body { margin: 0; background: #f4f6f8; color: #16202a; font-family: Arial, Helvetica, sans-serif; }
      .wrap { max-width: 760px; margin: 0 auto; padding: 28px 18px; }
      .header { border-bottom: 3px solid #1f7a6d; padding-bottom: 18px; margin-bottom: 22px; }
      h1 { font-size: 26px; line-height: 1.2; margin: 0 0 8px; }
      .meta { color: #5b6875; font-size: 14px; margin: 0; }
      .topic { background: #ffffff; border: 1px solid #dce3ea; border-radius: 8px; padding: 20px; margin: 16px 0; }
      h2 { font-size: 20px; margin: 0 0 10px; }
      h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #5b6875; margin: 18px 0 8px; }
      p { line-height: 1.55; }
      .summary { font-size: 16px; margin: 0 0 10px; }
      .why { border-left: 3px solid #1f7a6d; padding-left: 12px; color: #334150; }
      ul { padding-left: 20px; }
      li { margin: 8px 0; line-height: 1.45; }
      a { color: #0b6fcb; }
      .sources span { color: #66717d; font-size: 13px; }
      .footer { color: #66717d; font-size: 12px; margin-top: 22px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <h1>{{ subject }}</h1>
        <p class="meta">{{ profile.name }} - {{ digest_date }} - generato {{ generated_at }}</p>
      </div>
      {{ body|safe }}
      <p class="footer">Digest generato localmente da Personal Digestor.</p>
    </div>
  </body>
</html>
